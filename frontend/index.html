<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Anime Vibe Search -- test client</title>
<meta name="viewport" content="width=device-width, initial-scale=1" />
<style>
  :root {
    color-scheme: light dark;
    --bg: #0f1115;
    --panel: #171a21;
    --border: #2a2e38;
    --text: #e8e9ec;
    --muted: #9aa0ac;
    --accent: #7c9cff;
    --anime: #7c9cff;
    --manga: #ff9c7c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem 1rem 4rem;
  }
  main { max-width: 880px; margin: 0 auto; }
  h1 { font-size: 1.4rem; margin-bottom: 0.25rem; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 1.5rem; font-size: 0.9rem; }

  .method-toggle {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.5rem;
    margin-bottom: 1rem;
  }
  .method-toggle label {
    display: block;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.75rem 0.9rem;
    cursor: pointer;
    font-size: 0.85rem;
  }
  .method-toggle label.active { border-color: var(--accent); background: rgba(124,156,255,0.08); }
  .method-toggle input { display: none; }
  .method-toggle strong { display: block; font-size: 0.9rem; margin-bottom: 0.15rem; }
  .method-toggle span { color: var(--muted); font-size: 0.78rem; }

  form {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 1.25rem;
    display: grid;
    gap: 0.9rem;
  }
  label { font-size: 0.8rem; color: var(--muted); display: block; margin-bottom: 0.3rem; }
  input, select, textarea {
    width: 100%;
    background: #0f1115;
    border: 1px solid var(--border);
    color: var(--text);
    border-radius: 8px;
    padding: 0.6rem 0.7rem;
    font-size: 0.95rem;
    font-family: inherit;
  }
  textarea { resize: vertical; min-height: 3rem; }
  .row { display: grid; grid-template-columns: 1fr 140px 100px; gap: 0.75rem; }
  @media (max-width: 640px) { .row { grid-template-columns: 1fr; } }

  button {
    background: var(--accent);
    color: #0f1115;
    border: none;
    border-radius: 8px;
    padding: 0.7rem;
    font-weight: 600;
    font-size: 0.95rem;
    cursor: pointer;
  }
  button:disabled { opacity: 0.6; cursor: default; }

  #status { margin: 1rem 0; font-size: 0.9rem; color: var(--muted); min-height: 1.2em; }
  #status.error { color: #ff6b6b; }

  #results { display: grid; gap: 0.9rem; margin-top: 1rem; }
  .card {
    display: grid;
    grid-template-columns: 72px 1fr;
    gap: 0.9rem;
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 0.9rem;
  }
  .card.highlight { border-color: var(--accent); }
  .card img { width: 72px; height: 100px; object-fit: cover; border-radius: 6px; background: #0f1115; }
  .card .noimg { width: 72px; height: 100px; border-radius: 6px; background: #0f1115; }
  .card h3 { margin: 0 0 0.25rem; font-size: 1rem; }
  .badge {
    display: inline-block;
    font-size: 0.65rem;
    font-weight: 700;
    letter-spacing: 0.03em;
    padding: 0.1rem 0.4rem;
    border-radius: 4px;
    margin-right: 0.4rem;
    text-transform: uppercase;
  }
  .badge.anime { background: rgba(124,156,255,0.18); color: var(--anime); }
  .badge.manga { background: rgba(255,156,124,0.18); color: var(--manga); }
  .meta { color: var(--muted); font-size: 0.78rem; margin: 0.2rem 0 0.4rem; }
  .synopsis { font-size: 0.85rem; color: var(--text); opacity: 0.85; margin: 0; line-height: 1.4; }
  .tags { margin-top: 0.4rem; font-size: 0.72rem; color: var(--muted); }
  .score { font-size: 0.72rem; color: var(--muted); float: right; }

  .rank-badge {
    display: inline-block;
    font-size: 0.7rem;
    font-weight: 700;
    color: var(--accent);
    margin-right: 0.4rem;
  }
  .reason {
    font-size: 0.85rem;
    color: var(--text);
    margin: 0.2rem 0 0.5rem;
    line-height: 1.4;
  }
</style>
</head>
<body>
<main>
  <h1>Anime / Manga Vibe Search</h1>
  <p class="sub">Test client for the local anime-vibe-api server. Describe a mood, theme, or vibe -- not a title.</p>

  <div class="method-toggle">
    <label id="method-1-label" class="active">
      <input type="radio" name="method" value="search" checked />
      <strong>Direct search</strong>
      <span>Ranked by score -- 85% semantic similarity to your vibe, 15% popularity. Deterministic, no LLM.</span>
    </label>
    <label id="method-2-label">
      <input type="radio" name="method" value="recommend" />
      <strong>AI recommendation</strong>
      <span>A Groq-powered agent calls the MCP search tool itself and ranks its top 10 picks, each with a reason.</span>
    </label>
  </div>

  <form id="search-form">
    <div>
      <label for="api-key">X-API-Key</label>
      <input id="api-key" type="text" placeholder="paste an API key" autocomplete="off" />
    </div>
    <div>
      <label for="query">Vibe</label>
      <textarea id="query" placeholder="e.g. a hopeful post-apocalyptic story about rebuilding">a cozy slow-burn romance with found family themes</textarea>
    </div>
    <div class="row">
      <div>
        <label for="api-base">API base URL</label>
        <input id="api-base" type="text" value="http://127.0.0.1:8000" />
      </div>
      <div>
        <label for="type">Type</label>
        <select id="type">
          <option value="ANIME">ANIME</option>
          <option value="MANGA">MANGA</option>
        </select>
      </div>
      <div id="limit-field">
        <label for="limit">Limit</label>
        <input id="limit" type="number" min="1" max="50" value="10" />
      </div>
    </div>
    <button type="submit" id="submit-btn">Search</button>
  </form>

  <div id="status"></div>
  <div id="results"></div>
</main>

<script>
const form = document.getElementById("search-form");
const statusEl = document.getElementById("status");
const resultsEl = document.getElementById("results");
const submitBtn = document.getElementById("submit-btn");
const limitField = document.getElementById("limit-field");
const method1Label = document.getElementById("method-1-label");
const method2Label = document.getElementById("method-2-label");
const methodRadios = document.querySelectorAll('input[name="method"]');

function currentMethod() {
  return document.querySelector('input[name="method"]:checked').value;
}

function updateMethodUI() {
  const method = currentMethod();
  method1Label.classList.toggle("active", method === "search");
  method2Label.classList.toggle("active", method === "recommend");
  limitField.style.display = method === "recommend" ? "none" : "";
  submitBtn.textContent = method === "recommend" ? "Ask the agent" : "Search";
}
methodRadios.forEach((r) => r.addEventListener("change", updateMethodUI));
updateMethodUI();

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s ?? "";
  return div.innerHTML;
}

function mediaCardHtml(r, { highlight = false, showScore = true, badge = null, reason = null } = {}) {
  const img = r.cover_image_url
    ? `<img src="${escapeHtml(r.cover_image_url)}" alt="" loading="lazy" />`
    : `<div class="noimg"></div>`;
  const badgeClass = r.type === "ANIME" ? "anime" : "manga";
  const synopsis = r.synopsis
    ? escapeHtml(r.synopsis.length > 220 ? r.synopsis.slice(0, 220) + "..." : r.synopsis)
    : '<span style="opacity:0.5">No synopsis.</span>';
  const tags = [...(r.genres || []), ...(r.tags || [])].slice(0, 8).join(" · ");
  const scoreHtml = showScore ? `<span class="score">score ${r.score.toFixed(3)}</span>` : "";
  const metaHtml = `<div class="meta">popularity ${r.popularity}</div>`;
  const reasonHtml = reason ? `<p class="reason">${escapeHtml(reason)}</p>` : "";

  return `
    <div class="card${highlight ? " highlight" : ""}">
      ${img}
      <div>
        ${scoreHtml}
        <h3>${badge !== null ? `<span class="rank-badge">#${badge}</span>` : ""}<span class="badge ${badgeClass}">${r.type}</span>${escapeHtml(r.title_english || "(untitled)")}</h3>
        ${metaHtml}
        ${reasonHtml}
        <p class="synopsis">${synopsis}</p>
        ${tags ? `<div class="tags">${escapeHtml(tags)}</div>` : ""}
      </div>
    </div>
  `;
}

function renderSearchResults(data) {
  if (!data.results.length) {
    resultsEl.innerHTML = '<p style="color:var(--muted)">No matches.</p>';
    return;
  }
  resultsEl.innerHTML = data.results.map((r) => mediaCardHtml(r)).join("");
}

function renderRecommendation(data) {
  const recommendations = data.recommendations || [];
  if (!recommendations.length) {
    resultsEl.innerHTML = '<p style="color:var(--muted)">The agent didn\'t settle on any specific titles from its search.</p>';
    return;
  }

  resultsEl.innerHTML = recommendations
    .map((rec) =>
      mediaCardHtml(rec.media, {
        highlight: rec.rank === 1,
        showScore: false,
        badge: rec.rank,
        reason: rec.reason,
      })
    )
    .join("");
}

form.addEventListener("submit", async (e) => {
  e.preventDefault();
  const method = currentMethod();
  const apiBase = document.getElementById("api-base").value.trim().replace(/\/$/, "");
  const apiKey = document.getElementById("api-key").value.trim();
  const query = document.getElementById("query").value.trim();
  const type = document.getElementById("type").value;
  const limit = parseInt(document.getElementById("limit").value, 10) || 10;

  if (!apiKey) {
    statusEl.textContent = "Enter an API key first.";
    statusEl.className = "error";
    return;
  }
  if (!query) {
    statusEl.textContent = "Enter a query.";
    statusEl.className = "error";
    return;
  }

  submitBtn.disabled = true;
  statusEl.className = "";
  statusEl.textContent = method === "recommend" ? "Asking the agent (this calls an LLM + the MCP tool)..." : "Searching...";
  resultsEl.innerHTML = "";

  const started = performance.now();
  try {
    const endpoint = method === "recommend" ? "/api/v1/recommend" : "/api/v1/search/vibe";
    const body = method === "recommend" ? { vibe: query, type } : { query, type, limit };

    const res = await fetch(`${apiBase}${endpoint}`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json",
        "X-API-Key": apiKey,
      },
      body: JSON.stringify(body),
    });

    const elapsed = ((performance.now() - started) / 1000).toFixed(2);

    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      statusEl.className = "error";
      statusEl.textContent = `${res.status} ${res.statusText}: ${errBody.detail || "request failed"}`;
      return;
    }

    const data = await res.json();
    statusEl.className = "";

    if (method === "recommend") {
      statusEl.textContent = `Agent returned ${data.recommendations.length} recommendation(s) in ${elapsed}s`;
      renderRecommendation(data);
    } else {
      statusEl.textContent = `${data.count} result(s) in ${elapsed}s`;
      renderSearchResults(data);
    }
  } catch (err) {
    statusEl.className = "error";
    statusEl.textContent = `Network error: ${err.message}. Is the server running and is this origin in CORS_ALLOWED_ORIGINS?`;
  } finally {
    submitBtn.disabled = false;
  }
});
</script>
</body>
</html>
