# Render Blueprint. Connect this repo in the Render dashboard (New +
# -> Blueprint) and it provisions the service below.
#
# Free plan, deliberately: Render's Cron Job service type cannot run on
# the free tier at all ("Other service types don't support Free
# instances" -- Render's own docs), and carries a real minimum cost
# (>= $1/month) on any paid plan. Rather than pay for a weekly
# auto-refresh cron job, that job was dropped -- see docs/DEPLOY.md for
# how to re-run the catalog refresh manually instead. The tradeoff for
# staying on the free web service plan: it spins down after 15 minutes
# of no traffic, so the first request after any idle gap eats a real
# cold-start (Render waking the container, on top of this app's own
# startup time).
#
# Secrets (`sync: false`) are intentionally left out of this file --
# Render prompts for them once in the dashboard on first deploy and
# stores them there, so nothing sensitive ends up committed to git.

services:
  - name: anime-vibe-api
    type: web
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /healthz
    envVars:
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: ADMIN_MASTER_TOKEN
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: EMBEDDING_MODEL_NAME
        value: all-MiniLM-L6-v2
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      # INTERNAL_MCP_URL is deliberately not set here -- it self-derives
      # from Render's own $PORT at runtime (see recommend_agent.py). Only
      # add it if the agent ever needs to reach an MCP server on a
      # different host than itself.
